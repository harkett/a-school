# ============================================================
# aSchool — LE SYSTÈME (la boîte), identique de A à B.
# Une seule commande : docker compose up --build   (ou : .\Scripts\systeme.ps1)
#
# Les DONNÉES de la base vivent dans le volume Docker nommé `pgdata_dev` (disque Linux
# interne de Docker — fiable et rapide ; l'ancien montage du dossier Windows ./docker/pgdata
# faisait crasher Postgres, migré le 24/07/2026). Pour emmener la base sur une autre machine :
# une sauvegarde pg_dump (dossier db_backup/), restaurée là-bas — plus de copie de dossier.
# Le PROJET reste DEHORS : monté par volume (.:/app) — le code n'est pas enfermé.
# ============================================================
services:

  # --- La base de données (PostgreSQL + pgvector) ---
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: aschool
      POSTGRES_PASSWORD: aschool
      POSTGRES_DB: aschool_dev
    ports:
      - "5433:5432"          # 5433 côté machine : le PostgreSQL natif de Windows tient déjà 5432
    volumes:
      - pgdata_dev:/var/lib/postgresql/data             # DONNÉES dans le volume nommé (jamais sur le montage Windows — il faisait crasher Postgres)
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro  # extension vector à la 1re création
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aschool -d aschool_dev"]
      interval: 5s
      timeout: 3s
      retries: 30

  # --- La base de TEST (jetable, EN RAM) — strictement isolée de la base dev ---
  # Utilisée UNIQUEMENT par la suite pytest (TEST_DATABASE_URL → db_test:5432, dans le .env local).
  # Données en tmpfs : recréées à chaque démarrage, rapides, JAMAIS sur le montage Windows (pgdata)
  # → plus de crash Postgres sous la charge des tests, et la base dev n'est plus jamais renversée
  # par un passage de tests. Rien à faire voyager A↔B (base jetable). Pas de port publié : accès
  # interne seulement (le backend joint db_test par son nom de service sur le réseau compose).
  db_test:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: aschool
      POSTGRES_PASSWORD: aschool
      POSTGRES_DB: aschool_test
    tmpfs:
      - /var/lib/postgresql/data                        # données EN RAM (jetables)
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro  # extension vector à la création
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aschool -d aschool_test"]
      interval: 5s
      timeout: 3s
      retries: 30

  # --- Adminer : une page web pour VOIR la base (outil de dev, pas l'appli) ---
  # Ouvre http://localhost:8082 → serveur "db", base "aschool_dev".
  adminer:
    image: adminer:5
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db      # le champ "Serveur" pré-rempli sur le service "db"
    ports:
      - "8082:8080"                   # la page web côté machine sur 8082
    depends_on:
      - db

  # --- Le backend (FastAPI / uvicorn) ---
  backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env                 # clés LLM (CLAUDE_API_KEY_TEXTE…), SMTP, etc. — lues depuis le .env du dossier
    environment:
      # Pile de DÉVELOPPEMENT — la variable est posée EXPLICITEMENT. Les alertes de supervision
      # n'envoient de mail qu'en production (backend/supervision/alerts.py) ; laissée vide comme
      # avant, cette machine écrivait dans la boîte de l'admin avec le même sujet qu'une alerte
      # du VPS. Une variable ABSENTE laisse volontairement passer le mail : c'est ici qu'on la
      # pose, pas dans la règle qu'on affaiblirait pour tout le monde.
      ENV: development
      # Dans la boîte, le backend joint la base par le nom du service "db" (pas 127.0.0.1).
      # Défini APRÈS env_file → écrase le DATABASE_URL du .env pour viser "db:5432" dans la boîte.
      DATABASE_URL: postgresql+psycopg://aschool:aschool@db:5432/aschool_dev
      # Embeddings (BGE-M3) sur plusieurs cœurs : le garde-fou OMP_NUM_THREADS=1 de main.py est un
      # pansement Windows (plantage OpenMP hors Docker) inutile dans la boîte Linux — ici on rend
      # 8 cœurs au calcul (setdefault dans main.py → cette valeur gagne). Vectorisation ~8× plus vite.
      OMP_NUM_THREADS: "8"
      # Le modèle d'embedding ne se télécharge JAMAIS tout seul : il voyage dans le dossier
      # ./docker/hf-cache monté ci-dessous (4,3 Go), il ne se refabrique pas sur place. Posées
      # ICI, ces deux variables précèdent le démarrage de Python : elles couvrent TOUT ce qui
      # tourne dans la boîte — le serveur, la suite de tests, alembic, un `docker exec python -c`
      # — sans dépendre d'un ordre d'import. `huggingface_hub` fige la valeur dans une constante
      # à son import : posée trop tard, elle ne sert plus à rien (c'est pourquoi il y a aussi un
      # garde-fou dans backend/rag/embeddings.py, pour les entrées hors conteneur).
      # POUR REMPLIR LE CACHE UNE PREMIÈRE FOIS : mettre HF_HUB_OFFLINE à "0" le temps d'un
      # démarrage, laisser le modèle se télécharger, puis remettre "1".
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    # ERREUR CONNUE, NON RÉPARÉE, ET C'EST UN CHOIX (constaté le 02/08/2026).
    # Le surveillant de fichiers de --reload peut planter au démarrage sur cette trace :
    #     _rust_notify.WatchfilesRustInternalError: error in underlying watcher:
    #     Input/output error (os error 5)
    # Elle vient du dossier partagé avec Windows, qui ne rend pas toujours les événements de
    # fichiers que le surveillant attend. Ce n'est PAS un plantage de l'application : uvicorn
    # relance son surveillant tout seul et le rechargement fonctionne ensuite.
    # Mesuré sur le journal courant : 1 plantage, 3 démarrages du surveillant, 40 rechargements
    # réussis derrière. Intermittent, pas systématique — un redémarrage sur trois environ.
    # Le contournement (WATCHFILES_FORCE_POLLING=1) échangerait une trace occasionnelle et
    # sans effet contre une relecture permanente de 6 000 fichiers. On préfère la trace, et
    # on la documente ICI pour qu'elle ne soit pas confondue avec une vraie panne.
    # ATTENDRE LA BASE AVANT alembic — et non, ce n'est pas un doublon de `depends_on`.
    # `depends_on: db: condition: service_healthy` (plus bas) fait bien son travail, mais
    # seulement quand c'est COMPOSE qui démarre : au `docker compose up`. Au lancement du
    # moteur, ce n'est pas compose — c'est le démon qui relance tout seul les conteneurs
    # `restart: unless-stopped`, sans ordre et sans attendre la santé de personne. Le backend
    # partait alors avant la base, alembic échouait, le `&&` coupait, le conteneur mourait et
    # repartait : mesuré le 02/08 sur un démarrage à froid, 3 morts en 15 s avec la trace
    # « FATAL: the database system is starting up ». Personne ne l'avait vu parce que ça finit
    # par marcher. Les deux garde-fous couvrent donc DEUX chemins différents ; retirer l'un
    # rouvre le sien. Le pourquoi complet, avec les mesures, est dans le fichier appelé.
    command: sh -c "python outils_bdd/attendre_la_base.py && alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port 8001 --reload"
    ports:
      - "8001:8001"
    volumes:
      - .:/app                # PROJET DEHORS (le code vit dans le dossier, pas dans la boîte)
      - ./docker/hf-cache:/root/.cache/huggingface   # modèle d'embedding (BGE-M3, ~2,2 Go) DEHORS — téléchargé 1 fois, pas à chaque recréation
    depends_on:
      db:
        condition: service_healthy

  # --- Le frontend (React / Vite) ---
  frontend:
    image: node:24
    restart: unless-stopped
    working_dir: /app/frontend
    environment:
      VITE_API_HOST: backend  # dans la boîte, le proxy vise le service "backend"
      VITE_API_PORT: 8001
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/frontend/node_modules   # node_modules propre à la boîte (jamais mélangé à l'hôte)
    depends_on:
      - backend


  # --- LE LANCEUR DE RECETTE : la boîte qui sait ouvrir un navigateur ---------------------------
  # L'administrateur coche une note ; la recette part et le verdict decide si la case tombe.
  # C'est ce service qui l'execute — pas le backend, qui est une image Python partant AUSSI en
  # production : y installer Chromium et ses bibliotheques ajouterait 1,5 Go au serveur pour une
  # fonction de developpement. Ici, l'image officielle Playwright porte deja tout.
  #
  # PROFIL `recette` : le service NE DEMARRE PAS avec `docker compose up`. Il faut le demander —
  #     docker compose --profile recette up -d recette
  # L'image pese 2 Go : personne ne la telecharge sans en avoir besoin.
  #
  # LES IDENTIFIANTS viennent de Scripts/.recette.env, jamais du depot. Sans ce fichier, le
  # service demarre et repond, mais chaque passage echoue en le disant.
  recette:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    profiles: ["recette"]
    restart: unless-stopped
    working_dir: /app/frontend
    env_file:
      - Scripts/.recette.env
    environment:
      # Dans la boite, le front se joint par le nom du service — pas par localhost, qui
      # designerait le conteneur du lanceur lui-meme.
      BASE_URL: http://frontend:5173
      PORT: "9100"
    command: sh -c "npm ci && npx playwright install chromium && node /app/deploy/recette/serveur.js"
    volumes:
      - .:/app
      - /app/frontend/node_modules   # node_modules propre a la boite, comme pour le front
    depends_on:
      - frontend

  # --- LES DÉMONSTRATIONS : une seule pile pour toutes ------------------------------------------
  # IL Y AVAIT CINQ PILES ICI, une par démonstration : cinq backends de 800 Mo et cinq serveurs
  # Vite, mesurés à 5,7 Go pour cinq bacs à sable presque toujours au repos. La raison en était
  # qu'une démonstration était une BASE, et qu'un process ne se connecte qu'à une base.
  #
  # CE QUI A CHANGÉ. Les cinq bases sont devenues cinq SCHÉMAS de `aschool_demos`, et le
  # sous-domaine de la requête dit lequel servir. Un seul process suffit donc, et l'étanchéité
  # ne repose plus sur le système mais sur une ligne : le `schema_translate_map` posé à la
  # création de chaque session (backend/core/database.py). Le prof arrive toujours AVEC SON
  # IDENTITÉ, par un jeton de cinq minutes signé avec le DEMO_SECRET du .env, commun aux deux.
  #
  # L'APPLICATION RÉELLE GARDE SA PILE ET SA BASE. Ce backend-ci ne connaît pas `aschool_dev` :
  # il ne peut pas l'atteindre, même si une route oubliait un filtre.
  backend_demos:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENV: development
      # LA ligne qui distingue cette pile de `backend` : la base des démonstrations, celle qui
      # porte leurs schémas. Plus de MODE_DEMO — le drapeau ne vient plus de l'environnement
      # du process, qui les sert toutes, mais du schéma que la requête vise.
      DATABASE_URL: postgresql+psycopg://aschool:aschool@db:5432/aschool_demos
      OMP_NUM_THREADS: "8"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    # PAS de `alembic upgrade head` ici, contrairement à la pile réelle : il ne verrait que
    # `public`, qui ne porte que l'extension `vector`. Les schémas se migrent chacun avec
    # leur propre table de version, par `outils_bdd/migrer_les_demos.py`.
    command: sh -c "python outils_bdd/attendre_la_base.py && uvicorn backend.main:app --host 0.0.0.0 --port 8001 --reload"
    ports:
      - "8008:8001"     # même port que sur le VPS (deploy/installer-demos.sh)
    volumes:
      - .:/app
      - ./docker/hf-cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy

  frontend_demos:
    image: node:24
    restart: unless-stopped
    working_dir: /app/frontend
    environment:
      VITE_API_HOST: backend_demos
      VITE_API_PORT: 8001
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5174"
    ports:
      - "5174:5174"
    volumes:
      - .:/app
      - /app/frontend/node_modules
    depends_on:
      - backend_demos

  # --- Le routeur par sous-domaine, en local -----------------------------------------------
  # POURQUOI IL EXISTE MAINTENANT ET PAS AVANT. Les démonstrations s'atteignaient par leur PORT
  # (8002 à 8006) : le port disait laquelle. Le port ne dit plus rien — c'est le sous-domaine
  # qui choisit le schéma, et il n'y a personne, en local, pour le lire. Sans ce conteneur, la
  # pile locale ne pourrait plus éprouver l'aiguillage que le VPS utilisera.
  #
  # IL PORTE LA MÊME EXPRESSION que le bloc écrit par `deploy/installer-demos.sh`, sans le TLS
  # (pas de certificat en local). Ce qu'il valide ici est donc exactement ce qui vaudra là-bas :
  # `server_name` en expression régulière, et `Host` retransmis tel quel au backend.
  #
  # POUR L'ATTEINDRE DEPUIS UN NAVIGATEUR, il faut que `demo-ciela.aschool.fr` pointe sur
  # 127.0.0.1 dans le fichier `hosts` de la machine. En ligne de commande, l'en-tête suffit :
  #     curl -H "Host: demo-ciela.aschool.fr" http://localhost:8080/api/demo/etat
  nginx_demos:
    image: nginx:alpine
    restart: unless-stopped
    # 8080 : le routage par sous-domaine, celui du VPS. 8091-8096 : un port par démonstration,
    # la porte locale — nginx y écrit lui-même le nom d'hôte, donc ni ligne dans `hosts` ni
    # `allowedHosts` côté Vite. Voir l'en-tête de `deploy/nginx-demos-local.conf`.
    ports:
      - "8080:80"
      - "8091:8091"
      - "8092:8092"
      - "8093:8093"
      - "8094:8094"
      - "8095:8095"
      - "8096:8096"
    volumes:
      - ./deploy/nginx-demos-local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend_demos
      - frontend_demos
volumes:
  pgdata_dev:
