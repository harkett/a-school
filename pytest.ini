[pytest]
# Suite de tests aSchool — convention unique : fichiers test_*.py, fonctions test_*, assert simples.
# Lancer toute la suite :  docker exec a-school-backend-1 python -m pytest
# (rien n'est installe nativement sur le poste : Python passe par le conteneur — cf. .claude/PROJET.md)
# (le diagnostic SMTP est dans backend/mail/smtp_check.py — hors namespace test_, non collecté)
addopts = -q
norecursedirs = .venv venv node_modules frontend data .git dist build
