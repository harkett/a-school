# Le routeur par sous-domaine de la pile LOCALE — la répétition de ce que fera le VPS.
#
# MÊME EXPRESSION QUE LA PRODUCTION. Le bloc `server_name ~^demo-(?<demo>.+)\.aschool\.fr$` est
# celui qu'écrit `deploy/installer-demos.sh` ; ce qui se vérifie ici vaut là-bas. Ce qui diffère,
# et rien d'autre : pas de TLS (aucun certificat en local) et les amonts sont des noms de
# services Docker au lieu de 127.0.0.1.
#
# `proxy_set_header Host $host` EST LA LIGNE QUI FAIT TOUT. Le backend ne connaît la
# démonstration demandée que par cet en-tête. Sans elle, nginx enverrait le nom du service amont
# (`backend_demos`), aucun sous-domaine n'y serait lisible, et les cinq démonstrations rendraient
# le contenu du schéma réel — sans la moindre erreur pour le signaler.

server {
    listen 80;
    server_name ~^demo-(?<demo>.+)\.aschool\.fr$;

    location /api/ {
        proxy_pass         http://backend_demos:8001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering     off;
        proxy_http_version  1.1;
        proxy_read_timeout  3600s;
    }

    # En local le front est un serveur Vite, pas un dossier `dist` : on le proxifie au lieu de
    # servir des fichiers. `Upgrade` et `Connection` sont là pour le rechargement à chaud, qui
    # passe par une WebSocket — sans eux, l'écran ne se rafraîchirait plus tout seul.
    location / {
        proxy_pass         http://frontend_demos:5174;
        proxy_set_header   Host              $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_http_version 1.1;
    }
}

# TOUT CE QUI N'EST PAS UN SOUS-DOMAINE DE DÉMONSTRATION EST REFUSÉ ICI. Ce serveur par défaut
# attrape `localhost:8080` et les adresses IP : sans lui, nginx enverrait ces requêtes au premier
# bloc déclaré, c'est-à-dire aux démonstrations, et une adresse quelconque servirait un bac à
# sable. Le 444 ferme la connexion sans répondre — rien à apprendre de ce serveur.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# ─────────────────────────────────────────────────────────────────────────────────────────────
# UN PORT PAR DÉMONSTRATION — la porte LOCALE, en plus du routage par sous-domaine ci-dessus.
#
# POURQUOI. Le bloc par `server_name` reste la reproduction fidèle du VPS, mais il exige deux
# choses qu'un poste de développement n'a pas : une résolution de `demo-*.aschool.fr` (donc une
# ligne dans `hosts`, donc les droits administrateur) et un serveur Vite qui accepte ces
# noms (`server.allowedHosts`). Sans elles, le navigateur n'atteint jamais nginx, ou nginx
# atteint un Vite qui répond « Blocked request. This host is not allowed. »
#
# CE QUE FONT CES BLOCS. Le nom d'hôte n'est plus demandé au navigateur : nginx l'ÉCRIT
# lui-même. `proxy_set_header Host demo-<schema>.aschool.fr` vers l'API — c'est le seul en-tête
# que `schema_du_host()` lit, et il retire le port avant de comparer. Vers le serveur Vite,
# `Host localhost`, qu'il accepte sans configuration. Rien à poser sur la machine, rien à
# changer côté frontend, et la conf de production au-dessus reste intacte.
#
# CHAQUE PORT SERT UN SEUL SCHÉMA, ÉCRIT EN DUR. Une adresse ne peut donc pas viser un autre bac
# à sable que le sien, même par erreur de saisie — l'admin n'a aucun paramètre à ne pas se
# tromper. C'est l'équivalent local du sous-domaine, qui est lui aussi non négociable.
# ─────────────────────────────────────────────────────────────────────────────────────────────

server {
    listen 8091;
    server_name _;

    location /api/ {
        proxy_pass         http://backend_demos:8001;
        proxy_set_header   Host              demo-ciela.aschool.fr;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering     off;
        proxy_http_version  1.1;
        proxy_read_timeout  3600s;
    }

    location / {
        proxy_pass         http://frontend_demos:5174;
        proxy_set_header   Host              localhost;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_http_version 1.1;
    }
}

