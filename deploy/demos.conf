# ─────────────────────────────────────────────────────────────────────────────
# LA LISTE DES DÉMONSTRATIONS — une seule, lue par tout le reste.
#
# POURQUOI CE FICHIER EXISTE. Cinq démonstrations, c'est cinq bases, cinq services systemd,
# cinq blocs nginx et cinq lignes de sauvegarde. Recopier la liste dans chaque script, c'est
# se garantir qu'une sixième démonstration en oubliera trois — et l'oubli ne se voit pas : le
# service tourne, mais nginx ne l'expose pas, ou la base existe sans que rien ne la serve.
# Ici, on ajoute UNE ligne et tout suit.
#
# FORMAT : base:port:sous_domaine
#   base          nom de la base PostgreSQL, convention `<option>_demo`
#   port          port local du backend (127.0.0.1), jamais exposé directement
#   sous_domaine  le nom complet, couvert par l'entrée DNS wildcard *.aschool.fr
#
# LES PORTS. 8001 est pris par l'application réelle. Les démonstrations prennent la suite,
# dans l'ordre de leur arrivée. Un port ne se réutilise jamais après retrait d'une démo :
# une vieille configuration nginx qui traînerait pointerait sur la mauvaise.
#
# CE FICHIER SE LIT EN BASH (`source`) ET EN POWERSHELL : pas de guillemets, pas d'espaces
# autour des deux-points, une entrée par ligne. Les lignes vides et les `#` sont ignorés.
# ─────────────────────────────────────────────────────────────────────────────

ciela_demo:8002:demo-ciela.aschool.fr
cielb_demo:8003:demo-cielb.aschool.fr
creche_demo:8004:demo-creche.aschool.fr
crsa_demo:8005:demo-crsa.aschool.fr
ergo_demo:8006:demo-ergo.aschool.fr
