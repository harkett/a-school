# ─────────────────────────────────────────────────────────────────────────────
# LA LISTE DES SOUS-DOMAINES DES DÉMONSTRATIONS — une seule, lue par tout le reste.
#
# POURQUOI CE FICHIER EXISTE. Il ne sert plus qu'à UNE chose : dire au certificat quels noms
# il doit couvrir. Le port n'y figure plus (un port unique sert toutes les démonstrations,
# `PORT_DEMOS` dans installer-demos.sh) et le nom de base non plus — nginx nomme par
# expression régulière, et la liste des démonstrations servies se lit dans `pg_namespace`.
#
# FORMAT : un sous-domaine par ligne, nom complet, couvert par l'entrée DNS wildcard
# *.aschool.fr. Les lignes vides et les `#` sont ignorés.
# ─────────────────────────────────────────────────────────────────────────────
demo-ciela.aschool.fr
demo-cielb.aschool.fr
demo-creche.aschool.fr
demo-crsa.aschool.fr
